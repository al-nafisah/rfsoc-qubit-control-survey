<text x="708.0" y="130.0" font-size="14" fill="#16150F" text-anchor="middle" font-weight="normal" font-style="normal">Host</text>
<text x="708.0" y="148.2" font-size="14" fill="#16150F" text-anchor="middle" font-weight="normal" font-style="normal">software</text>
