<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img">
<title>What each project publishes</title>
<desc>A table of six projects against gateware source, build scripts, bitstreams, host software, board designs and licence. QubiC: all public, BSD-3 (LBNL). QICK: all public except partial board files, MIT. FIREQ: bitstreams and software only, AGPL-3.0. RISC-Q: source and scripts, no bitstreams, no licence. SQ-CARS: partial gateware, bitstreams and software, no licence. QiController: client software only, GPL-3.0.</desc>
<defs><marker id="head-16150F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16150F"/></marker><marker id="head-6B6358" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6358"/></marker><marker id="head-9A5B00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A5B00"/></marker></defs>
