<text x="836.0" y="148.2" font-size="14" fill="#16150F" text-anchor="middle" font-weight="normal" font-style="normal">designs</text>
<text x="920" y="130" font-size="14" fill="#16150F" text-anchor="start" font-weight="normal" font-style="normal">Licence</text>
