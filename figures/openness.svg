<text x="920" y="409" font-size="14" fill="#9A5B00" text-anchor="start" font-weight="normal" font-style="normal">none</text>
<line x1="40" y1="432" x2="1160" y2="432" stroke="#DDD7C9" stroke-width="1"/>
<text x="40" y="465" font-size="16" fill="#16150F" text-anchor="start" font-weight="bold" font-style="normal">QiController</text>
<text x="161.2" y="458" font-size="11" fill="#9A5B00" text-anchor="start" font-weight="normal" font-style="normal">5</text>
<circle cx="324.0" cy="460" r="8" fill="#FFFFFF" stroke="#16150F" stroke-width="1.5"/>
<circle cx="452.0" cy="460" r="8" fill="#FFFFFF" stroke="#16150F" stroke-width="1.5"/>
<circle cx="580.0" cy="460" r="8" fill="#FFFFFF" stroke="#16150F" stroke-width="1.5"/>
<circle cx="708.0" cy="460" r="8" fill="#16150F" stroke="#16150F" stroke-width="1.5"/>
<circle cx="836.0" cy="460" r="8" fill="#FFFFFF" stroke="#16150F" stroke-width="1.5"/>
<text x="920" y="465" font-size="14" fill="#16150F" text-anchor="start" font-weight="normal" font-style="normal">GPL-3.0 (client)</text>
<line x1="40" y1="488" x2="1160" y2="488" stroke="#DDD7C9" stroke-width="1"/>
<circle cx="48" cy="514" r="8" fill="#16150F" stroke="#16150F" stroke-width="1.5"/>
<text x="62" y="519" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">public</text>
<circle cx="150" cy="514" r="8" fill="#FFFFFF" stroke="#16150F" stroke-width="1.5"/>
<path d="M150,506 A8,8 0 0,0 150,522 z" fill="#16150F"/>
<text x="164" y="519" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">partly</text>
<circle cx="252" cy="514" r="8" fill="#FFFFFF" stroke="#16150F" stroke-width="1.5"/>
<text x="266" y="519" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">not public</text>
<text x="386" y="519" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">Text: the project runs on boards it did not design (AMD evaluation cards, or QubiC's)</text>
<text x="40" y="560.0" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">1  Hardware randomized compiling and parameterized circuit execution: HDL not found in any public branch.</text>
<text x="40" y="580.15" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">2  tProcessor v2 bitstreams are served from a SLAC web directory, not the repository. Board files: ZCU111 only.</text>
<text x="40" y="600.3" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">3  No licence file, so the code is visible but no right to reuse it is granted.</text>
<text x="40" y="620.45" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">4  The block design is public; the custom RTL modules it instantiates are not in the repository.</text>
<text x="40" y="640.6" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">5  The Python client is GPL-3.0; its README says development happens on an internal KIT GitLab.</text>
<text x="40" y="660.75" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">All six instantiate AMD's RF Data Converter and Zynq IP, which Vivado generates and which is not open.</text>
</svg>
