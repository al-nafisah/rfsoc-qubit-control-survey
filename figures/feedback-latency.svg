<text x="40" y="780.0" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">Loopback measurements (QICK, SQ-CARS, RISC-Q) run a short cable from DAC to ADC in place of fridge wiring.</text>
<text x="40" y="800.15" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">RISC-Q's number is decoding feedback for a distance-3 surface code across three boards, two network hops included.</text>
<text x="40" y="820.3" font-size="13" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">Each row is the source's own definition; the README gives the wording.</text>
