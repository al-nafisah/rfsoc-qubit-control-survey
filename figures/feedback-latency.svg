<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" role="img">
<title>What each feedback-latency number counts</title>
<desc>Six stages of a feedback loop, A readout integration, B ADC and readout DSP, C state decision, D branch in the sequencer, E pulse out and DAC, F cables and fridge, against seven published numbers. None counts the readout integration. QICK 184 to 211 ns counts B to E. QubiC 150 ns counts B to E and does not say about F. A third-party QubiC measurement, 205 ns, counts B to E. QiController 428 ns counts B to E. SQ-CARS 250 ns counts only B and E, with no decision. RISC-Q 446 ns counts the branch and adds a decoder, with B, C and E not stated. FIREQ reports none.</desc>
<defs><marker id="head-16150F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16150F"/></marker><marker id="head-6B6358" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B6358"/></marker><marker id="head-9A5B00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A5B00"/></marker></defs>
