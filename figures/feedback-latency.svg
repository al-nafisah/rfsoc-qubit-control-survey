<text x="40" y="48" font-size="24" fill="#16150F" text-anchor="start" font-weight="bold" font-style="normal">What each feedback-latency number counts</text>
<text x="40" y="76.0" font-size="14" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">A measurement-conditioned pulse passes through six stages. Each published number covers a</text>
<text x="40" y="94.2" font-size="14" fill="#6B6358" text-anchor="start" font-weight="normal" font-style="normal">different subset, so they cannot be ranked against one another.</text>
